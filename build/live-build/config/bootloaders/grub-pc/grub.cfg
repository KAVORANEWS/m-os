source /boot/grub/config.cfg

menuentry "Try or Install M OS" --hotkey=t {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@
	initrd	@INITRD_LIVE@
}

menuentry "Try or Install M OS (safe graphics)" --hotkey=s {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@ nomodeset
	initrd	@INITRD_LIVE@
}

menuentry "Try M OS (copy to RAM, 8 GB+ recommended)" --hotkey=r {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@ toram
	initrd	@INITRD_LIVE@
}

submenu 'Troubleshooting...' --hotkey=u {

	source /boot/grub/theme.cfg

	menuentry "Boot with verbose messages (no splash)" {
		linux	@KERNEL_LIVE@ boot=live components username=mos hostname=m-os findiso=${iso_path} systemd.show_status=1
		initrd	@INITRD_LIVE@
	}

	if [ "${grub_platform}" = "efi" ]; then
		menuentry "UEFI Firmware Settings" --hotkey=f {
			fwsetup
		}
	fi

	if @ENABLE_VERIFY_CHECKSUMS@; then
		menuentry "Verify integrity of the boot medium" --hotkey=v {
			linux	@KERNEL_LIVE@ @APPEND_VERIFY_CHECKSUMS@
			initrd	@INITRD_LIVE@
		}
	fi

	menuentry "Reboot" {
		reboot
	}

	menuentry "Power off" {
		halt
	}
}
