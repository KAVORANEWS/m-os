name: Hardware compatibility report
description: Report how M OS runs on your computer
labels: [hardware]
body:
  - type: input
    id: model
    attributes: {label: Computer / motherboard model}
    validations: {required: true}
  - type: textarea
    id: specs
    attributes: {label: "Output of: inxi -Fxz (or lspci -nn; lsusb)", render: text}
    validations: {required: true}
  - type: checkboxes
    id: works
    attributes:
      label: What works
      options:
        - label: Boots (UEFI)
        - label: Boots (Legacy BIOS)
        - label: Graphics / correct resolution
        - label: Wi-Fi
        - label: Ethernet
        - label: Bluetooth
        - label: Sound
        - label: Sleep / resume
        - label: Installation completed
  - type: textarea
    id: notes
    attributes: {label: Problems or notes}
